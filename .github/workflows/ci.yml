name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          # Reads the "volta" pin from package.json
          node-version-file: package.json

      - run: corepack enable

      - run: yarn install --immutable

      - name: Check the tree is fully rebranded
        run: node scripts/fork/rebrand.mjs --check

      - run: yarn typecheck
      - run: yarn format
      # Type-aware lint rules resolve some imports through the built packages.
      - run: yarn build
      - run: yarn lint

      - name: Unit tests
        run: yarn test:unit
